function mergePlanUpdates(input){const next=clone(input),applied=new Set(next.appliedUpdates||[]);for(const update of INITIAL.planUpdates||[]){if(applied.has(update.id))continue;for(const field of ['projects','tasks']){const ids=new Set(next[field].map(x=>x.id));const allowed=new Set(update[field==='projects'?'projectIds':'taskIds']);for(const item of INITIAL[field])if(allowed.has(item.id)&&!ids.has(item.id)){next[field].push(clone(item));ids.add(item.id)}}const sources=new Set(next.source.map(x=>x.id||((x.date||'2026-10-20')+'|'+x.time+'|'+x.text)));for(const item of INITIAL.source){if(!update.sourceIds.includes(item.id)||sources.has(item.id))continue;next.source.push(clone(item));sources.add(item.id)}applied.add(update.id)}next.appliedUpdates=[...applied];next.planUpdates=clone(INITIAL.planUpdates||[]);return validate(next)}
let storageProblem='';let state;try{const raw=localStorage.getItem(KEY);state=raw?mergePlanUpdates(validate(JSON.parse(raw))):clone(INITIAL);if(raw&&JSON.stringify(state)!==JSON.stringify(JSON.parse(raw)))localStorage.setItem(KEY,JSON.stringify(state))}catch(e){storageProblem='暂时无法读取或更新本机数据。现显示初始计划，原数据不会被自动覆盖。可先导出原始数据或导入备份。';state=clone(INITIAL)}

const dayStamp=d=>Date.parse(d+'T00:00:00Z');const addDays=(date,n)=>new Date(dayStamp(date)+n*86400000).toISOString().slice(0,10);const dayDiff=(a,b)=>Math.round((dayStamp(a)-dayStamp(b))/86400000);const due=t=>addDays(state.settings.start,t.day);const dateText=d=>d.slice(5).replace('-',' / ');const weekdays=['周日','周一','周二','周三','周四','周五','周六'];const week=d=>weekdays[new Date(d+'T12:00:00Z').getUTCDay()];
let view=['today','projects','schedule','review'].includes(location.hash.slice(1))?location.hash.slice(1):'today';let selected=today();let projectFilter='全部',scheduleFilter='all',searchTerm='';let toastTimer;let modalDirty=false;

function validate(s){
 const fail=()=>{throw Error('备份格式或数据内容不完整')};const str=(v,n=20000)=>typeof v==='string'&&v.length<=n;const id=v=>str(v,80)&&/^[a-zA-Z0-9_-]+$/.test(v);const validDate=v=>str(v,10)&&/^\d{4}-\d{2}-\d{2}$/.test(v)&&Number.isFinite(Date.parse(v+'T00:00:00Z'))&&new Date(v+'T00:00:00Z').toISOString().slice(0,10)===v;
 if(!s||s.version!==2||!s.settings||!Array.isArray(s.projects)||!s.projects.length||s.projects.length>100||!Array.isArray(s.tasks)||s.tasks.length>2000)fail();
 const z=s.settings;if(!str(z.name,80)||!str(z.goal,2000)||!validDate(z.start)||!Number.isFinite(z.dailyMinutes)||z.dailyMinutes<15||z.dailyMinutes>720||!/^([01]\d|2[0-3]):[0-5]\d$/.test(z.workTime))fail();
 const pids=new Set();for(const p of s.projects){if(!id(p.id)||pids.has(p.id)||!['pink','violet','red'].includes(p.color)||!['id','name','subtitle','platform','status','goal','success','boundary','notes'].every(k=>str(p[k])))fail();pids.add(p.id)}
 const tids=new Set();for(const t of s.tasks){if(!id(t.id)||tids.has(t.id)||!pids.has(t.project)||!Number.isInteger(t.day)||Math.abs(t.day)>3650||!Number.isFinite(t.minutes)||t.minutes<0||t.minutes>1440||!Number.isFinite(t.order)||!['P0','P1','P2'].includes(t.priority)||!Object.hasOwn(statuses,t.status)||!['title','action','deliverable','condition','notes','result','budget'].every(k=>str(t[k])))fail();tids.add(t.id)}
 if(!Array.isArray(s.source)||s.source.length>100||s.source.some(x=>!str(x.time,20)||!str(x.text)||(x.date!==undefined&&!validDate(x.date))))fail();if(s.appliedUpdates!==undefined&&(!Array.isArray(s.appliedUpdates)||s.appliedUpdates.length>100||s.appliedUpdates.some(x=>!id(x))))fail();return clone(s);
}
function persist(message='已保存到本机'){try{localStorage.setItem(KEY,JSON.stringify({...state,updatedAt:new Date().toISOString()}));state.updatedAt=new Date().toISOString();storageProblem='';$('#saveState').textContent='已保存到本机';$('#saveState').classList.remove('bad');if(message)toast(message);render();return true}catch(e){storageProblem='本机保存失败：浏览器可能禁用存储或空间不足。当前修改仍在页面内，请立即导出备份。';renderStorage();toast('保存失败，请导出备份');return false}}

function renderToday(){const day=dayDiff(selected,state.settings.start);const list=state.tasks.filter(t=>t.day===day&&active(t)).sort((a,b)=>a.order-b.order);const visible=list.slice(0,3),extra=list.slice(3);const pending=visible.filter(t=>t.status!=='done'),total=visible.reduce((a,t)=>a+t.minutes,0),complete=visible.filter(t=>t.status==='done').length;const allDone=state.tasks.filter(t=>t.status==='done').length,ongoing=state.tasks.filter(active).length;const focus=pending[0]||visible[0];const overdue=state.tasks.filter(t=>due(t)<selected&&['todo','doing'].includes(t.status)).sort((a,b)=>a.day-b.day);let minute=Number(state.settings.workTime.slice(0,2))*60+Number(state.settings.workTime.slice(3));const times=t=>{const fmt=m=>String(Math.floor(m/60)%24).padStart(2,'0')+':'+String(m%60).padStart(2,'0');let out=fmt(minute)+'—'+fmt(minute+t.minutes);minute+=t.minutes+10;return out};const isToday=selected===today();

>项</small></strong><p>等待条件，不抢今天</p></div></div><div class="card"><div class="side-title">'+ico('route')+'这轮怎么推进</div><div class="path"><span class="num">1</span><div><h3>先盘资源，试出表达</h3><p>个人 IP 拍法与结构；服装、美食和老白资源核实。</p></div></div><div class="path"><span class="num">2</span><div><h3>只选一个首测品</h3><p>先设预算和停止线，再做小样本内容；小红书安排固定维护。</p></div></div><div class="path"><span class="num">3</span><div><h3>用结果决定下一轮</h3><p>算真实投入产出。考古加、直播间、替代品按条件启用。</p></div></div><p class="side-note">这里的排期、样本数量和工作量是建议，尚未代表你已经执行。没有测试数据的路线都保留为待验证。</p><button class="textbtn" data-go="projects">看看全部项目 '+ico('arrow')+'</button></div><div class="card"><div class="side-title">'+ico('file')+'原始记录始终保留</div><p class="small">依据 10 月 20—21 日的 '+state.source.length+' 条原始记录整理。计划随时可改，原始想法可对照查看。</p><button class="textbtn" data-action="source">查看原始记录 '+ico('arrow')+'</button></div></aside></div>';

function renderSchedule(){const pass=t=>scheduleFilter==='all'||t.status===scheduleFilter;const titles=['先试拍，盘已有资源','定结构，盘账号基线','核价与村里 IP 定位','研究样本，做好笔记','只选一个首测品','核辣椒经营条件','周复盘，决定下一周','主测补内容，账号维护','记测试账，拍村里试片','辣椒最小经营方案','复核盈利可能','筛选值得继续的品','整理下阶段选题','14 天复盘，收窄方向'];let html=heading('A LITTLE PROGRESS, EVERY DAY','给未来两周，留出节奏。','建议每天 1—3 项，默认约 2 小时；点行动可改日期、时长和状态。','<button class="btn" data-action="settings">'+ico('clock')+' 调整周期</button>');html+='<div class="tabs">'+[['all','全部'],['todo','待开始'],['doing','进行中'],['done','已完成'],['waiting','条件待满足'],['paused','暂缓']].map(([v,l])=>'<button class="chip '+(v===scheduleFilter?'active':'')+'" data-schedule-filter="'+v+'">'+l+'</button>').join('')+'</div><div class="timeline">';
 const days=[...new Set([...Array.from({length:14},(_,i)=>i),...state.tasks.map(t=>t.day)])].sort((a,b)=>a-b);let seen=0;for(const d of days){const ts=state.tasks.filter(t=>t.day===d&&pass(t)).sort((a,b)=>a.order-b.order);if(scheduleFilter!=='all'&&!ts.length)continue;const date=addDays(state.settings.start,d),total=ts.filter(active).reduce((a,t)=>a+t.minutes,0);seen++;html+='<section class="day-card"><div class="day-label '+(date===today()?'today':'')+'"><span class="day-index">DAY '+(d+1)+'</span><strong>'+date.slice(5).replace('-','.')+'</strong><p>'+week(date)+'</p></div><div class="day-content"><h3>'+esc(titles[d]||'自行安排')+'</h3>'+ts.map(t=>'<div class="schedule-task '+t.status+'"><span class="tiny-dot"></span><button data-action="edit-task" data-id="'+t.id+'">'+esc(t.title)+'</button><span class="mini-tag '+(t.status==='waiting'?'amber':'gray')+'">'+(t.status==='waiting'?'条件备选':statuses[t.status])+' · '+t.minutes+'m</span></div>').join('')+(ts.length?'':'<p class="small">给这一天留一点空白。</p>')+'<p class="day-total '+(total>state.settings.dailyMinutes?'over':'')+'">'+total+' 分钟已启用'+(total>state.settings.dailyMinutes?' · 超出每日时间，建议改期':'')+(ts.some(t=>t.status==='waiting')?' · 条件备选未计入时长':'')+'</p></div></section>'}return html+(seen?'':'<div class="empty">这个状态还没有行动。</div>')+'</div>'}
function renderReview(){const done=state.tasks.filter(t=>t.status==='done'),results=state.tasks.filter(t=>t.result.trim());return heading('REFLECT, THEN MOVE FORWARD','留下结果，下一步才更准。','记录完成证据，备份你的修改。没有真实数据时，结论保留为待验证。')+'<div class="review-grid"><section class="card"><div class="kicker">本轮进展</div><h2>'+done.length+' 个行动已完成</h2><p>优先比较实际投入、实得佣金或毛利、退款与退货、内容持续性和自己愿不愿意长期做。付费带来的成交，要扣掉投放成本。</p><div class="progressline"><span style="width:'+(state.tasks.length?done.length/state.tasks.length*100:0)+'%"></span></div><p class="small">'+results.length+' 个行动已填写结果</p>'+(results.map(t=>'<div class="review-result"><button class="textbtn" data-action="edit-task" data-id="'+t.id+'">'+esc(t.title)+' '+ico('edit')+'</button><p>'+esc(t.result)+'</p></div>').join('')||'<div class="resultcallout">先做一个小测试，再打开行动详情，在“实际结果”中填入数据、链接和决定。</div>')+'<div class="actionrow"><button class="btn" data-action="report">'+ico('download')+' 导出文字复盘</button></div></section><aside><section class="card"><div class="kicker">你的计划，你来掌握</div><h2>保存与迁移</h2><p>编辑后自动存到当前浏览器。不同手机、电脑和浏览器之间不会自动同步。定期导出备份，可在另一台设备导入继续使用。</p><div class="actionrow"><button class="btn primary" data-action="export">'+ico('download')+' 导出备份</button><button class="btn" data-action="import">'+ico('upload')+' 导入备份</button></div><div class="actionrow"><button class="btn" data-action="portable">'+ico('file')+' 下载含修改的 H5</button></div><p class="small" style="margin-top:12px">JSON 备份适合迁移和恢复；H5 文件内含当前计划，适合离线留存。移动端请用系统浏览器打开。</p></section><section class="card" style="margin-top:18px"><div class="kicker">对照来源</div><h2>你记录的 '+state.source.length+' 条想法</h2><p>原始记录单独保留。新增的排期、样本数量和执行顺序是建议，商品机会和利润仍需核实。</p><div class="actionrow"><button class="btn" data-action="source">'+ico('file')+' 查看原始记录</button><button class="btn" data-action="settings">调整计划设置</button></div><button class="textbtn" style="margin-top:12px;color:var(--red)" data-action="reset">恢复初始计划</button></section></aside></div>'}
function render(){document.title=state.settings.name+'的工作台 · 让想法落地';$('#brandName').textContent=state.settings.name+'的工作台';document.querySelectorAll('[data-view]').forEach(b=>{if(b.dataset.view===view)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});$('#app').innerHTML=({today:renderToday,projects:renderProjects,schedule:renderSchedule,review:renderReview})[view]();renderStorage()}

function editTask(id){const isNew=!id,t=isNew?{id:uid(),project:state.projects[0].id,day:dayDiff(selected,state.settings.start),title:'',minutes:30,priority:'P1',action:'',deliverable:'',condition:'',status:'todo',notes:'',result:'',budget:'待填写',order:state.tasks.reduce((m,t)=>Math.max(m,t.order),0)+1}:state.tasks.find(t=>t.id===id);if(!t)return;const body='<form id="taskForm" data-task="'+t.id+'" data-new="'+isNew+'"><div class="modal-body">'+field('行动名称','<input name="title" required maxlength="300" value="'+esc(t.title)+'" placeholder="写一个能开始的具体动作">')+'<div class="fields2">'+field('所属项目','<select name="project">'+state.projects.map(p=>option(p.id,p.name,t.project)).join('')+'</select>')+field('当前状态','<select name="status">'+Object.entries(statuses).map(([v,l])=>option(v,l,t.status)).join('')+'</select>')+'</div><div class="fields2">'+field('计划日期','<input name="date" type="date" required value="'+due(t)+'">')+field('预计用时（分钟）','<input name="minutes" type="number" min="0" max="1440" required value="'+t.minutes+'">')+'</div><div class="fields2">'+field('优先级','<select name="priority">'+['P0','P1','P2'].map(v=>option(v,v+({P0:' · 本轮关键',P1:' · 推进验证',P2:' · 备选'}[v]),t.priority)).join('')+'</select>')+field('当天排序（数字小的先显示）','<input name="order" type="number" min="0" max="999999" value="'+t.order+'" required>')+'</div>'+field('第一步 / 怎么做','<textarea name="action" maxlength="10000">'+esc(t.action)+'</textarea>')+field('完成标准 / 要留下的证据','<textarea name="deliverable" maxlength="10000">'+esc(t.deliverable)+'</textarea>')+field('启动条件（无条件可留空）','<textarea name="condition" maxlength="10000">'+esc(t.condition)+'</textarea>','“条件待满足”的行动不会挤进今日计划。满足后把状态改为“待开始”。')+field('预算上限 / 停止条件','<textarea name="budget" maxlength="10000">'+esc(t.budget)+'</textarea>','样品、订阅、投放、备货等支出，执行前自己填写；页面不替你付款。')+field('实际结果','<textarea name="result" maxlength="10000" placeholder="记录链接、实际花费、成交/退款、实得收益，以及继续/修改/停止的决定">'+esc(t.result)+'</textarea>')+field('备注','<textarea name="notes" maxlength="10000">'+esc(t.notes)+'</textarea>')+'</div><div class="modal-actions"><div>'+(!isNew?'<button class="btn danger" type="button" data-action="delete-task" data-id="'+t.id+'">'+ico('trash')+' 删除</button>':'')+'<button class="btn" type="button" data-action="copy-task" data-id="'+t.id+'" '+(isNew?'disabled':'')+'>'+ico('copy')+' 任务卡</button></div><button class="btn primary" type="submit">保存修改</button></div></form>';modal(isNew?'添加一个行动':'行动详情与修改',body)}

function exportState(){download(JSON.stringify({...state,exportedAt:new Date().toISOString()},null,2),'application/json;charset=utf-8','金鑫鑫工作计划-'+today()+'.json');toast('备份已生成，请保存到文件')}
function reportText(){return '# '+state.settings.name+'的工作计划\n\n周期：'+state.settings.start+' — '+addDays(state.settings.start,13)+'\n目标：'+state.settings.goal+'\n\n'+state.projects.map(p=>'## '+p.name+'\n目标：'+p.goal+'\n完成标准：'+p.success+'\n边界：'+p.boundary+'\n补充：'+p.notes+'\n\n'+state.tasks.filter(t=>t.project===p.id).sort((a,b)=>a.day-b.day).map(t=>'### '+t.title+'\n日期：'+due(t)+'｜'+statuses[t.status]+'｜'+t.minutes+' 分钟｜'+t.priority+'\n第一步：'+t.action+'\n完成标准：'+t.deliverable+'\n条件：'+(t.condition||'无')+'\n预算/停止线：'+t.budget+'\n实际结果：'+(t.result||'待回填')+'\n备注：'+t.notes+'\n').join('\n')).join('\n')+'\n所有排期与工作量为建议；尚未记录结果的商品机会均待验证。\n'}
async function copyTask(id){const t=state.tasks.find(t=>t.id===id);if(!t)return;const p=projectBy(t.project);const text='请在【'+p.name+'】项目中推进：'+t.title+'。\n\n要解决的问题：'+p.goal+'\n已知背景：'+p.boundary+'\n输入资料：2026年10月20—21日原始记录，以及该项目已确认的现有资料；缺少的信息先核实。\n具体执行与第一行动：'+t.action+'\n交付物和完成标准：'+t.deliverable+'\n边界：'+(t.condition||'不默认代为花费、联系合作方或发布内容。')+'\n建议日期/优先级：'+due(t)+' / '+t.priority+'\n预算和停止条件：'+t.budget+'\n已有结果：'+(t.result||'待回填')+'\n补充：'+t.notes;try{await navigator.clipboard.writeText(text);toast('可转发任务卡已复制')}catch{download(text,'text/plain;charset=utf-8','任务卡-'+t.id+'.txt');toast('任务卡已下载')}}
function portable(){const doc=document.documentElement.cloneNode(true);doc.querySelector('#initialState').textContent=JSON.stringify(state).replace(/</g,'\\u003c');doc.querySelector('#modal').removeAttribute('open');doc.querySelector('#modal').innerHTML='';doc.querySelector('#app').innerHTML='';doc.querySelector('#storageError').innerHTML='';doc.querySelector('#toast').classList.remove('visible');download('<!doctype html>\n'+doc.outerHTML,'text/html;charset=utf-8','金鑫鑫工作计划-'+today()+'.html');toast('已生成含当前修改的 H5 文件')}
document.addEventListener('click',async e=>{const go=e.target.closest('[data-view],[data-go]');if(go){navigate(go.dataset.view||go.dataset.go);return}const b=e.target.closest('[data-project-filter],[data-schedule-filter]');if(b){if(b.dataset.projectFilter)projectFilter=b.dataset.projectFilter;else scheduleFilter=b.dataset.scheduleFilter;render();return}const el=e.target.closest('[data-action]');if(!el)return;const id=el.dataset.id;switch(el.dataset.action){case 'show-additions':projectFilter='10月21日新增';searchTerm='';navigate('projects');break;case 'new-task':editTask();break;case 'edit-task':if(modalDirty&&!confirm('当前修改尚未保存，确定转到其他行动？'))return;editTask(id);break;case 'settings':showSettings();break;case 'project':showProject(id);break;case 'source':showSource();break;case 'close-modal':closeModal();break;case 'toggle':{const t=state.tasks.find(t=>t.id===id);if(!t)return;const next=t.status==='done'?'todo':'done';if(next==='done'&&t.status==='waiting'&&!confirm('这个行动有启动条件。确认条件已满足且行动已完成？'))return;t.status=next;persist(next==='done'?'已完成，一小步也算数':'已改为待开始');break}case 'delete-task':if(confirm('删除这项行动？建议先导出备份。')){state.tasks=state.tasks.filter(t=>t.id!==id);modalDirty=false;$('#modal').close();persist('行动已删除')}break;case 'copy-task':await copyTask(id);break;case 'export':exportState();break;case 'import':$('#importFile').click();break;case 'report':download(reportText(),'text/plain;charset=utf-8','工作计划与复盘-'+today()+'.txt');toast('文字复盘已生成');break;case 'portable':portable();break;case 'raw-export':try{download(localStorage.getItem(KEY)||'{}','application/json;charset=utf-8','原始存储-请保留.json')}catch{toast('浏览器不允许读取原始存储')}break;case 'reset':if(confirm('恢复初始计划会替换本机的全部修改。已备份并确定继续？')){state=clone(INITIAL);persist('已恢复初始计划')}break}});
document.addEventListener('change',e=>{if(e.target.id==='dayPicker'){selected=e.target.value||today();render()}if(e.target.closest('#modal'))modalDirty=true});
document.addEventListener('input',e=>{if(e.target.closest('#modal'))modalDirty=true;if(e.target.id==='projectSearch'){const pos=e.target.selectionStart;searchTerm=e.target.value;render();$('#projectSearch').focus();try{$('#projectSearch').setSelectionRange(pos,pos)}catch{}}});
document.addEventListener('submit',e=>{if(!e.target.closest('#modal'))return;e.preventDefault();const form=e.target,fd=new FormData(form),v=k=>String(fd.get(k)||'').trim();if(form.id==='taskForm'){const id=form.dataset.task,isNew=form.dataset.new==='true';const old=state.tasks.find(t=>t.id===id);let data={id,project:v('project'),day:dayDiff(v('date'),state.settings.start),title:v('title'),minutes:Number(v('minutes')),priority:v('priority'),action:v('action'),deliverable:v('deliverable'),condition:v('condition'),status:v('status'),notes:v('notes'),result:v('result'),budget:v('budget'),order:Number(v('order'))};if(!data.title){toast('请填写行动名称');return}if(data.day>3650||data.day< -3650){toast('日期超出可用范围，请调整');return}if(data.condition&&data.status==='todo'&&old?.status==='waiting'&&!confirm('确认启动条件已满足，启用这个行动？'))return;const candidate={...state,tasks:isNew?[...state.tasks,data]:state.tasks.map(t=>t.id===id?data:t)};try{state=validate(candidate)}catch{toast('有字段超出范围，请检查输入');return}}
 else if(form.id==='settingsForm'){const candidate={...state,settings:{name:v('name'),goal:v('goal'),start:v('start'),dailyMinutes:Number(v('dailyMinutes')),workTime:v('workTime')}};if(candidate.settings.start!==state.settings.start&&!confirm('修改开始日会整体平移所有行动日期，确定继续？'))return;try{state=validate(candidate)}catch{toast('请检查日期、时间和可用分钟数');return}selected=state.settings.start}
 else if(form.id==='projectForm'){const id=form.dataset.project;state.projects=state.projects.map(p=>p.id===id?{...p,name:v('name'),subtitle:v('subtitle'),goal:v('goal'),success:v('success'),boundary:v('boundary'),notes:v('notes')}:p)}else return;modalDirty=false;persist();$('#modal').close()});
$('#modal').addEventListener('cancel',e=>{e.preventDefault();closeModal()});
$('#importFile').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;if(f.size>5000000){toast('备份文件过大，请检查文件');return}let candidate;try{candidate=validate(JSON.parse(await f.text()))}catch{toast('备份格式不正确，当前计划未改变');return}if(!confirm('导入将替换本机当前计划。已备份当前修改并确定继续？'))return;state=mergePlanUpdates(candidate);modalDirty=false;if($('#modal').open)$('#modal').close();persist('导入成功，继续推进');});
window.addEventListener('hashchange',()=>{const v=location.hash.slice(1);if(['today','projects','schedule','review'].includes(v)){view=v;render()}});
window.addEventListener('beforeunload',e=>{if(modalDirty||storageProblem){e.preventDefault();e.returnValue=''}});
window.addEventListener('storage',e=>{if(e.key===KEY&&e.newValue){if(modalDirty){toast('另一个窗口更新了计划；请先保存或备份本页');return}try{state=mergePlanUpdates(validate(JSON.parse(e.newValue)));render();toast('已读取另一个窗口的修改')}catch{}}});
render();
</script></body></html>
